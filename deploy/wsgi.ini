[uwsgi]
# Fail loudly: unknown options and an app that cannot be imported stop the service
# (the reason then shows in `journalctl -u flask`) instead of starting half-working.
strict = true
need-app = true

master = true
processes = 2
threads = 2
enable-threads = true
vacuum = true
die-on-term = true

socket = 127.0.0.1:5055

chdir = /var/www/flask/app
wsgi-file = /var/www/flask/app/wsgi.py
callable = app
virtualenv = /var/www/flask/venv

# Log file (uwsgi creates the file 640 www-data:www-data, so edoha must be in the www-data group to read it). Create the folder once:
#   sudo mkdir -p /var/log/flask && sudo chown www-data:www-data /var/log/flask && sudo chmod 755 /var/log/flask
# Startup errors that happen before the file opens still go to `journalctl -u flask`.
logto = /var/log/flask/wsgi.log
log-date = true
log-reopen = true
