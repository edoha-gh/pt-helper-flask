# Installed by `sync.py deploy` to /etc/nginx/conf.d/flask.conf (included inside http { }).
# Fronts the uwsgi service on 127.0.0.1:5055 (uwsgi protocol, so uwsgi_pass, not proxy_pass).

log_format main '$remote_addr $server_name $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" $server_port '
                '$upstream_bytes_received "$sent_http_content_type" $host "$https"';

log_format kv 'site="$server_name" server="$host" dest_port="$server_port" dest_ip="$server_addr" '
              'src="$remote_addr" user="$remote_user" '
              'time_local="$time_local" protocol="$server_protocol" status="$status" '
              'bytes_out="$bytes_sent" bytes_in="$upstream_bytes_received" '
              'http_referer="$http_referer" http_user_agent="$http_user_agent" '
              'nginx_version="$nginx_version" http_x_forwarded_for="$http_x_forwarded_for" '
              'uri_query="$query_string" uri_path="$uri" '
              'http_method="$request_method" response_time="$upstream_response_time" '
              'request_time="$request_time" category="$sent_http_content_type" https="$https"';

upstream flask_uwsgi {
    server 127.0.0.1:5055;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    access_log /var/log/nginx/access_main.log main;
    access_log /var/log/nginx/access_kv.log kv;

    # The site has no login and lists attack commands. Uncomment to limit it to your LAN.
    # allow 192.168.1.0/24;
    # allow 127.0.0.1;
    # deny all;

    location / {
        include uwsgi_params;
        uwsgi_pass flask_uwsgi;
        uwsgi_read_timeout 60s;
    }
}
